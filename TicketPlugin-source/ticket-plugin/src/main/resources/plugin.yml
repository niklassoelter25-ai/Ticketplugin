name: TicketPlugin
version: "1.1"
main: de.ticketplugin.TicketPlugin
api-version: "26.3"
description: Ticket-System mit Discord-Anbindung (Zwei-Wege-Chat)

commands:
  ticket:
    description: Ticket erstellen, beantworten oder schliessen
    usage: /ticket [Beschreibung]
    permission: ticket.use

permissions:
  ticket.use:
    description: Tickets erstellen und beantworten
    default: true
  ticket.admin:
    description: Config neu laden (/ticket reload)
    default: op
