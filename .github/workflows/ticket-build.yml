name: Build TicketPlugin

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Build
        working-directory: TicketPlugin-Quelle/Ticket-Plugin
        run: gradle build

      - uses: actions/upload-artifact@v5
        with:
          name: TicketPlugin-jar
          path: TicketPlugin-Quelle/Ticket-Plugin/build/libs/*.jar
